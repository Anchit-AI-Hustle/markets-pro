# Nightly signal refresh: fetch real EOD bars after each market's close and
# commit the cache. The push triggers the Vercel deploy, whose build runs the
# engine over the committed data — so the site's signals update themselves
# every trading day with no server to keep alive.
name: Refresh signals

on:
  schedule:
    - cron: "15 13 * * 1-5" # 18:45 IST — after NSE close, EOD data settled
    - cron: "45 21 * * 1-5" # after the US close (EDT and EST both covered)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A single failed symbol must not block the rest of the universe; the
      # build degrades to that symbol's previous cache file.
      - name: Fetch EOD bars and FX
        run: |
          PYTHONPATH=src python3 -m autotrader.data.fetch \
            --regions india us --out data/live --range 2y \
            || echo "::warning::some symbols failed; committing what succeeded"
      # Cross-checks the cache against each market's own trading calendar and
      # flags implausible sessions; a stale or corrupt symbol here degrades
      # the screener and signals silently unless something says so out loud.
      - name: Verify cache freshness and sanity
        run: |
          PYTHONPATH=src python3 -m autotrader.data.quality --data data/live --regions india us \
            || echo "::warning::data quality check found hard failures — see job log"
      # Filings change only when a company files, so a failure here is not
      # worth blocking the deploy over — the page shows the previous cache.
      - name: Refresh SEC fundamentals
        run: |
          PYTHONPATH=src python3 -m autotrader.data.fundamentals --out data/live \
            || echo "::warning::fundamentals refresh failed; keeping previous cache"
      - name: Preview today's signals in the job log
        run: PYTHONPATH=src python3 -m autotrader.signals.live --data data/live --out /dev/null
      # Re-screens the whole universe on every refresh, same cadence as
      # signals — a screener that only ran on demand would silently drift out
      # of date with the cache it reports on.
      - name: Screen the universe
        run: |
          PYTHONPATH=src python3 -m autotrader.screener.core --data data/live \
            --regions india us --out data/live/screener.json
      - name: Commit refreshed cache
        run: |
          git config user.name "signals-refresh"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "cache unchanged — no deploy needed"
          else
            git commit -m "Refresh live market data ($(date -u +%F))"
            git push
          fi
