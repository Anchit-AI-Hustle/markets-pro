# Nightly signal refresh: fetch real EOD bars after each market's close and
# commit the cache. The push triggers the Vercel deploy, whose build runs the
# engine over the committed data — so the site's signals update themselves
# every trading day with no server to keep alive.
name: Refresh signals

on:
  schedule:
    - cron: "15 13 * * 1-5" # 18:45 IST — after NSE close, EOD data settled
    - cron: "45 21 * * 1-5" # after the US close (EDT and EST both covered)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # A single failed symbol must not block the rest of the universe; the
      # build degrades to that symbol's previous cache file.
      - name: Fetch EOD bars and FX
        run: |
          PYTHONPATH=src python3 -m autotrader.data.fetch \
            --regions india us --out data/live --range 2y \
            || echo "::warning::some symbols failed; committing what succeeded"
      # Cross-checks the cache against each market's own trading calendar and
      # flags implausible sessions; a stale or corrupt symbol here degrades
      # the screener and signals silently unless something says so out loud.
      - name: Verify cache freshness and sanity
        run: |
          PYTHONPATH=src python3 -m autotrader.data.quality --data data/live --regions india us \
            || echo "::warning::data quality check found hard failures — see job log"
      # Filings change only when a company files, so a failure here is not
      # worth blocking the deploy over — the page shows the previous cache.
      - name: Refresh SEC fundamentals
        run: |
          PYTHONPATH=src python3 -m autotrader.data.fundamentals --out data/live \
            || echo "::warning::fundamentals refresh failed; keeping previous cache"
      # AMFI publishes once a day after valuation; a miss just leaves
      # yesterday's NAVs in place rather than blocking the deploy.
      - name: Refresh mutual fund NAVs
        run: |
          PYTHONPATH=src python3 -m autotrader.data.funds --out data/live \
            || echo "::warning::fund NAV refresh failed; keeping previous cache"
      # No-ops unless ALPHAVANTAGE_KEY is set as a repository secret; the
      # pages keep saying "not available" until one exists.
      # Adds beta, analyst target, dividend yield and EPS to the US names —
      # figures a filing does not carry. No-ops without a key. Indian
      # fundamentals are NOT filled here: no free tier was found that covers
      # them (see docs/AUTO-INVEST.md), so those pages stay honest about it.
      - name: Enrich US fundamentals (needs a free provider key)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          PYTHONPATH=src python3 -m autotrader.data.fundamentals_intl \
            --enrich-us --out data/live \
            || echo "::warning::provider enrichment skipped"
      - name: Preview today's signals in the job log
        run: PYTHONPATH=src python3 -m autotrader.signals.live --data data/live --out /dev/null
      # Re-screens the whole universe on every refresh, same cadence as
      # signals — a screener that only ran on demand would silently drift out
      # of date with the cache it reports on.
      - name: Screen the universe
        run: |
          PYTHONPATH=src python3 -m autotrader.screener.core --data data/live \
            --regions india us --out data/live/screener.json
      # The evidence study needs decades, not days. The deep cache is
      # refreshed on Saturdays only — filings and prices move, twenty years
      # of history does not — and the study is cheap once it exists.
      # The deep cache itself is gitignored -- 200 MB of twenty-year history
      # has no business in the repository -- which means a fresh runner has
      # none of it. Without this step the study below ran against an empty
      # directory and its failure was swallowed by the `||`, so the committed
      # result was whatever someone last generated by hand.
      # Gated in the shell, not with an `if:` -- the condition is "Saturday, or
      # the study output is missing", and a workflow expression cannot look at
      # the filesystem to answer the second half. An `if:` here that duplicated
      # only the first half would silently skip the bootstrap run.
      - name: Fetch twenty-year history for the evidence study (weekly)
        run: |
          if [ "$(date -u +%u)" = "6" ] || [ ! -f data/research/fitness.json ]; then
            PYTHONPATH=src python3 -m autotrader.data.fetch \
              --regions india us --out data/research --range 20y --pause 0.3 \
              || echo "::warning::deep fetch incomplete; the study will cover fewer names"
          fi
      - name: Re-run the evidence study (weekly)
        run: |
          if [ ! -f data/research/fitness.json ] || [ "$(date -u +%u)" = "6" ]; then
            # No `|| true` here. A study that cannot run is a finding, not a
            # warning to scroll past -- the evidence tab is the one claim this
            # product is built on.
            PYTHONPATH=src python3 -m autotrader.research.fitness --data data/research
          else
            echo "not Saturday and a study already exists — keeping it"
          fi
      - name: Commit refreshed cache
        run: |
          git config user.name "signals-refresh"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live data/research
          if git diff --cached --quiet; then
            echo "cache unchanged — no deploy needed"
          else
            git commit -m "Refresh live market data ($(date -u +%F))"
            git push
          fi
